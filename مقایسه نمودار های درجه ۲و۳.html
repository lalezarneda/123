<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>مقایسهٔ نمودار x² و x³ — آموزش تعاملی | ندا لاله زار</title>
<style>
  *{box-sizing:border-box;}

  /* ==================== تنظیمات پیش‌فرض (موبایل) ==================== */
  html, body {
    margin: 0;
    padding: 0;
    height: auto;
    overflow-y: auto;
    overflow-x: hidden;
  }
  body{
    font-family: Tahoma, "Segoe UI", sans-serif;
    background: radial-gradient(1200px 700px at 15% -10%, #1e293b 0%, #0b1220 45%, #060a12 100%);
    color:#e2e8f0;
    padding: 12px 14px;
    display: flex;
    min-height: 100vh;
  }
  .wrap{
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 18px;
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
  }
  
  /* هدر (عنوان‌ها) */
  .hero{ text-align:center; line-height:1.5; }
  .hero h1{ font-size: 24px; margin:0 0 8px; font-weight:800; letter-spacing: -0.5px; }
  .hero h1 .c1{ color:#38bdf8; text-shadow:0 0 20px rgba(56,189,248,.6); }
  .hero h1 .c2{ color:#fb7185; text-shadow:0 0 20px rgba(251,113,133,.6); }
  .hero p{ margin:0; color:#94a3b8; font-size: 15px; font-weight: 500; }

  .credit{
    margin: 12px auto 0;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    border-radius: 25px;
    font-size: 14px;
    font-weight: 700;
    color: #cbd5e1;
    background: linear-gradient(135deg, rgba(56,189,248,.15), rgba(16,185,129,.15));
    border: 1px solid rgba(148,163,184,.3);
    box-shadow: 0 8px 20px -10px rgba(56,189,248,.5);
  }
  .credit .badge-icon{
    display:inline-grid;
    place-items:center;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #10b981);
    color: #06101f; font-size: 13px; font-weight: 900;
    box-shadow: 0 0 15px rgba(56,189,248,.8);
  }
  .credit .name{ color: #f1f5f9; font-weight: 800; }

  /* چیدمان */
  .layout{
    display: flex;
    flex-direction: column;
    gap: 18px;
    width: 100%;
  }

  /* کارت نمودار */
  .graph-card{
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px;
    width: 100%;
    height: 55vh; /* نمودار ۵۵ درصد ارتفاع صفحه را می‌گیرد */
    min-height: 380px;
    background: linear-gradient(160deg,rgba(30,41,59,.9),rgba(11,18,32,.95));
    border: 1px solid rgba(148,163,184,.25);
    border-radius: 20px;
    box-shadow: 0 25px 50px -25px rgba(0,0,0,.9);
    overflow: hidden;
  }
  .canvas-wrap{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas{ max-width:100%; max-height:100%; width:auto; height:auto; display:block; border-radius:14px; }
  
  /* راهنمای رنگ‌ها */
  .legend{
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
    color: #cbd5e1;
    padding-top: 8px;
  }
  .legend span{ display:inline-flex; align-items:center; gap:8px; }
  .swatch{ width:24px; height:4px; border-radius:4px; display:inline-block; }
  .sw-blue{ background:#38bdf8; box-shadow:0 0 12px #38bdf8; }
  .sw-rose{ background:#fb7185; box-shadow:0 0 12px #fb7185; }
  .sw-amber{ background:#facc15; box-shadow:0 0 12px #facc15; border-radius:50%; width:12px; height:12px; }

  /* پنل توضیحات */
  .panel{
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
    width: 100%;
    background: linear-gradient(160deg,rgba(30,41,59,.8),rgba(11,18,32,.95));
    border: 1px solid rgba(148,163,184,.25);
    border-radius: 20px;
    box-shadow: 0 25px 50px -25px rgba(0,0,0,.9);
    min-height: 300px; /* افزایش ارتفاع برای جا دادن متن‌های بزرگ‌تر */
  }
  .panel-title{
    font-size: 18px;
    font-weight: 800;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(148,163,184,.2);
  }
  .panel-title .live{
    width:10px; height:10px; border-radius:50%; background:#22c55e; box-shadow:0 0 12px #22c55e;
    animation:blink 1.4s infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1} 50%{opacity:.25} }

  /* کارت متن */
  .steps{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 0;
  }
  .step-card{
    width: 100%;
    display: flex;
    gap: 18px; /* کمی فاصله بیشتر بین آیکون و متن */
    background: rgba(51,65,85,.5);
    border: 1px solid rgba(148,163,184,.2);
    border-right: 5px solid var(--accent,#38bdf8);
    border-radius: 16px;
    padding: 22px 20px; /* افزایش فاصله داخلی */
    opacity: 0;
    box-shadow: 0 12px 30px -15px var(--accent,#38bdf8);
    will-change: opacity;
  }
  .num{
    flex: 0 0 auto;
    width: 46px; height: 46px; /* بزرگتر شدن دایره */
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-weight: 900;
    font-size: 22px; /* بزرگتر شدن عدد */
    color: #06101f;
    background: var(--accent,#38bdf8);
    box-shadow: 0 0 20px var(--accent,#38bdf8);
  }
  .txt{ min-width: 0; }
  
  /* ==================== تغییرات درخواستی شما ==================== */
  .txt h3{ margin:0 0 10px; font-size: 19px; font-weight:800; color:#f1f5f9; line-height: 1.7; }
  .txt p{ margin:0; font-size: 17px; color:#cbd5e1; line-height: 1.9; }
  /* ============================================================ */
  
  .txt p b{ color:var(--accent,#38bdf8); font-weight: 900; }

  /* فرمول‌های داخل متن */
  .math-inline{
    display: inline-block;
    direction: ltr;
    unicode-bidi: isolate;
    font-family: 'Cambria Math', 'Times New Roman', Georgia, serif;
    font-style: normal;
    font-weight: 800;
    font-size: 1.1em;
    padding: 2px 10px;
    margin: 0 4px;
    border-radius: 8px;
    background: linear-gradient(135deg, rgba(16,185,129,.25), rgba(56,189,248,.15));
    border: 1px solid rgba(52,211,153,.6);
    color: #a7f3d0;
    text-shadow: 0 0 12px rgba(52,211,153,.5);
    letter-spacing: 1px;
    vertical-align: middle;
    white-space: nowrap;
  }
  .math-inline.point{
    background: linear-gradient(135deg, rgba(250,204,21,.25), rgba(251,146,60,.15));
    border-color: rgba(250,204,21,.7);
    color: #fde68a;
    text-shadow: 0 0 12px rgba(250,204,21,.6);
    letter-spacing: 1.5px;
  }

  /* دکمه */
  #nextBtn{
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: 1px solid rgba(56,189,248,.6);
    background: linear-gradient(135deg,rgba(56,189,248,.25),rgba(99,102,241,.25));
    color: #e0f2fe;
    font-family: inherit;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 10px 25px -12px rgba(56,189,248,.6);
    margin-top: auto;
  }
  #nextBtn:hover:not(:disabled){
    background: linear-gradient(135deg,rgba(56,189,248,.4),rgba(99,102,241,.4));
    box-shadow: 0 0 30px -5px rgba(56,189,248,.8);
    transform: translateY(-2px);
  }
  #nextBtn:active:not(:disabled){ transform: scale(.97); }
  #nextBtn:disabled{
    opacity: .5;
    cursor: not-allowed;
    background: rgba(71,85,105,.3);
    border-color: rgba(148,163,184,.2);
    color: #94a3b8;
    box-shadow: none;
  }

  /* ==================== کلاس اجباری موبایل ==================== */
  body.force-mobile .layout {
    display: flex !important;
    flex-direction: column !important;
  }
  body.force-mobile .graph-card {
    height: 55vh !important;
    min-height: 380px !important;
  }

  /* ==================== تنظیمات دسکتاپ ==================== */
  @media (min-width: 1024px) {
    html, body { height: 100%; overflow: hidden; }
    body { padding: 20px 25px; }
    .layout{
      display: grid;
      grid-template-columns: minmax(0,1.1fr) minmax(0,0.9fr);
      gap: 16px;
      height: 100%;
    }
    .graph-card { height: auto; min-height: 0; }
    .panel { height: auto; min-height: 0; }
    .hero h1 { font-size: 26px; }
    .panel-title { font-size: 19px; }
    .txt h3 { font-size: 20px; } /* در دسکتاپ هم بزرگتر می‌شود */
    .txt p { font-size: 18px; }  /* در دسکتاپ هم بزرگتر می‌شود */
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>مقایسهٔ نمودار <span class="c1">y = x²</span> و <span class="c2">y = x³</span></h1>
    <p>ریاضی ۳ — پایهٔ دوازدهم تجربی | مقایسهٔ گام‌به‌گام با کنترل دکمه</p>
    <div class="credit">
      <span class="badge-icon">✎</span>
      <span>تهیه و تنظیم: <span class="name">ندا لاله زار</span></span>
    </div>
  </header>
  <main class="layout">
    <section class="graph-card">
      <div class="canvas-wrap">
        <canvas id="cv"></canvas>
      </div>
      <div class="legend">
        <span><i class="swatch sw-blue"></i> y = x² (تابع زوج)</span>
        <span><i class="swatch sw-rose"></i> y = x³ (تابع فرد)</span>
        <span><i class="swatch sw-amber"></i> نقاط برخورد</span>
      </div>
    </section>
    <aside class="panel">
      <div class="panel-title"><span class="live"></span> مقایسهٔ گام‌به‌گام</div>
      <div class="steps" id="steps"></div>
      <button id="nextBtn" disabled>در حال آماده‌سازی…</button>
    </aside>
  </main>
</div>

<script>
// ==================== ترفند نهایی برای مرورگرهای داخلی اپلیکیشن‌ها ====================
if (window.innerWidth < 1024 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
    document.body.classList.add('force-mobile');
}
// ====================================================================================

(function () {
  /* ================= CANVAS ================= */
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = 680, H = 620;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width  = W * dpr;
  cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.direction = 'ltr';

  const XMIN = -1.9, XMAX = 1.9, YMIN = -1.5, YMAX = 2.5;
  const sx = W / (XMAX - XMIN);
  const sy = H / (YMAX - YMIN);
  const X = x => (x - XMIN) * sx;
  const Y = y => (YMAX - y) * sy;

  const f2 = x => x * x;
  const f3 = x => x * x * x;
  const C2 = '#38bdf8';
  const C3 = '#fb7185';
  const HL2 = '#10b981';
  const HL3 = '#f97316';
  const AM  = '#facc15';

  const faDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  const fa = s => String(s).replace(/\d/g, d => faDigits[+d]);
  const hexA = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
  };

  /* ================= DRAW PRIMITIVES ================= */
  function drawBg() {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#0d1728');
    g.addColorStop(1, '#080d18');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawGrid() {
    ctx.save();
    ctx.strokeStyle = 'rgba(148,163,184,.12)';
    ctx.lineWidth = 1;
    for (let x = -1.5; x <= 1.51; x += 0.5) {
      if (Math.abs(x) < 0.001) continue;
      ctx.beginPath(); ctx.moveTo(X(x), 0); ctx.lineTo(X(x), H); ctx.stroke();
    }
    for (let y = -1.5; y <= 2.51; y += 0.5) {
      if (Math.abs(y) < 0.001) continue;
      ctx.beginPath(); ctx.moveTo(0, Y(y)); ctx.lineTo(W, Y(y)); ctx.stroke();
    }
    ctx.restore();
  }

  function drawAxes() {
    ctx.save();
    ctx.strokeStyle = 'rgba(203,213,225,.5)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(0, Y(0)); ctx.lineTo(W, Y(0));
    ctx.moveTo(X(0), H); ctx.lineTo(X(0), 0);
    ctx.stroke();

    ctx.fillStyle = 'rgba(203,213,225,.65)';
    ctx.beginPath();
    ctx.moveTo(W - 1, Y(0));
    ctx.lineTo(W - 15, Y(0) - 5.5);
    ctx.lineTo(W - 15, Y(0) + 5.5);
    ctx.closePath(); ctx.fill();

    ctx.beginPath();
    ctx.moveTo(X(0), 1);
    ctx.lineTo(X(0) - 5.5, 15);
    ctx.lineTo(X(0) + 5.5, 15);
    ctx.closePath(); ctx.fill();

    ctx.font = 'italic 15px Georgia, serif';
    ctx.fillStyle = 'rgba(203,213,225,.75)';
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText('x', W - 22, Y(0) + 10);
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('y', X(0) + 12, 8);

    ctx.font = '13px Tahoma, sans-serif';
    ctx.fillStyle = 'rgba(148,163,184,.9)';
    ctx.strokeStyle = 'rgba(203,213,225,.5)';
    ctx.lineWidth = 1.4;

    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    [-1, 1].forEach(v => {
      ctx.beginPath();
      ctx.moveTo(X(v), Y(0) - 4.5); ctx.lineTo(X(v), Y(0) + 4.5);
      ctx.stroke();
      ctx.fillText(fa(v), X(v), Y(0) + 9);
    });

    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    [-1, 1, 2].forEach(v => {
      ctx.beginPath();
      ctx.moveTo(X(0) - 4.5, Y(v)); ctx.lineTo(X(0) + 4.5, Y(v));
      ctx.stroke();
      ctx.fillText(fa(v), X(0) - 10, Y(v));
    });
    ctx.restore();
  }

  function drawCurve(fn, color, progress, lw) {
    lw = lw || 3.4;
    if (progress <= 0) return;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

    const xStart = XMIN - 0.35;
    const xEndAll = XMAX + 0.35;
    const xEnd = xStart + (xEndAll - xStart) * progress;
    const N = 700;

    ctx.beginPath();
    let started = false;
    for (let i = 0; i <= N; i++) {
      const x = xStart + (xEnd - xStart) * (i / N);
      const px = X(x), py = Y(fn(x));
      if (!started) { ctx.moveTo(px, py); started = true; }
      else ctx.lineTo(px, py);
    }

    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = color;

    ctx.lineWidth = lw + 5;
    ctx.globalAlpha = .22;
    ctx.shadowColor = color; ctx.shadowBlur = 22;
    ctx.stroke();

    ctx.globalAlpha = 1;
    ctx.lineWidth = lw;
    ctx.shadowBlur = 12;
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function drawHighlightedSegment(fn, color, xa, xb, head, headFade, opacity) {
    if (head <= 0.005 || opacity <= 0.01) return;

    const xHead = xa + (xb - xa) * head;

    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    const N = 220;
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const x = xa + (xHead - xa) * (i / N);
      const px = X(x), py = Y(fn(x));
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }

    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.32 * opacity;
    ctx.lineWidth = 8;
    ctx.shadowColor = color;
    ctx.shadowBlur = 28;
    ctx.stroke();

    ctx.globalAlpha = 0.98 * opacity;
    ctx.lineWidth = 3.4;
    ctx.shadowBlur = 16;
    ctx.stroke();

    const headAlpha = opacity * headFade;
    if (headAlpha > 0.01) {
      const hx = X(xHead), hy = Y(fn(xHead));

      const hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, 22);
      hg.addColorStop(0,   hexA(color, 0.95 * headAlpha));
      hg.addColorStop(0.4, hexA(color, 0.42 * headAlpha));
      hg.addColorStop(1,   hexA(color, 0));
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      ctx.fillStyle = hg;
      ctx.beginPath(); ctx.arc(hx, hy, 22, 0, Math.PI * 2); ctx.fill();

      ctx.beginPath();
      ctx.arc(hx, hy, 3.6, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${headAlpha})`;
      ctx.shadowColor = color;
      ctx.shadowBlur = 22;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    ctx.restore();
  }

  function shadeBetween(topFn, botFn, xa, xb, fill) {
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    const N = 140;
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const x = xa + (xb - xa) * (i / N);
      const px = X(x), py = Y(topFn(x));
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    for (let i = N; i >= 0; i--) {
      const x = xa + (xb - xa) * (i / N);
      ctx.lineTo(X(x), Y(botFn(x)));
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.restore();
  }

  function glowPoint(x, y, color, intensity) {
    if (intensity <= 0.015) return;
    const px = X(x), py = Y(y);
    const k = Math.min(1, intensity);

    const g = ctx.createRadialGradient(px, py, 0, px, py, 58);
    g.addColorStop(0,    hexA(color, .70 * k));
    g.addColorStop(0.35, hexA(color, .25 * k));
    g.addColorStop(1,    hexA(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, 58, 0, Math.PI * 2); ctx.fill();

    const r = 8 + 12 * k;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.strokeStyle = hexA(color, .9 * k);
    ctx.lineWidth = 1.5 + k;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(px, py, 3.5 + 2 * k, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = color; ctx.shadowBlur = 28 * k;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function chip(text, cx, cy, color) {
    ctx.save();
    ctx.font = 'bold 14px Georgia, serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const w = ctx.measureText(text).width + 18;
    const h = 24;
    ctx.fillStyle = 'rgba(8,13,24,.82)';
    ctx.strokeStyle = hexA(color, .55);
    ctx.lineWidth = 1.4;
    const r = 8;
    ctx.beginPath();
    ctx.moveTo(cx - w/2 + r, cy - h/2);
    ctx.arcTo(cx + w/2, cy - h/2, cx + w/2, cy + h/2, r);
    ctx.arcTo(cx + w/2, cy + h/2, cx - w/2, cy + h/2, r);
    ctx.arcTo(cx - w/2, cy + h/2, cx - w/2, cy - h/2, r);
    ctx.arcTo(cx - w/2, cy - h/2, cx + w/2, cy - h/2, r);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = color;
    ctx.fillText(text, cx, cy + 1);
    ctx.restore();
  }

  function symmetryOverlay(k) {
    if (k <= 0.01) return;
    ctx.save();

    ctx.setLineDash([7, 7]);
    ctx.strokeStyle = `rgba(52,211,153,${0.9 * k})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(X(0), 0); ctx.lineTo(X(0), H);
    ctx.stroke();
    ctx.setLineDash([]);

    const p = 1.1, q = p * p;
    ctx.strokeStyle = `rgba(56,189,248,${0.8 * k})`;
    ctx.lineWidth = 1.8;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(X(-p), Y(q)); ctx.lineTo(X(p), Y(q));
    ctx.stroke();
    ctx.setLineDash([]);

    [-p, p].forEach(v => {
      ctx.beginPath();
      ctx.arc(X(v), Y(q), 7, 0, Math.PI * 2);
      ctx.fillStyle = hexA(C2, .95 * k);
      ctx.shadowColor = C2; ctx.shadowBlur = 18;
      ctx.fill(); ctx.shadowBlur = 0;
    });

    const a = 0.9, b = a * a * a;
    ctx.strokeStyle = `rgba(251,113,133,${0.85 * k})`;
    ctx.lineWidth = 1.8;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(X(-a), Y(-b)); ctx.lineTo(X(a), Y(b));
    ctx.stroke();
    ctx.setLineDash([]);

    [[-a, -b], [a, b]].forEach(pt => {
      ctx.beginPath();
      ctx.arc(X(pt[0]), Y(pt[1]), 7, 0, Math.PI * 2);
      ctx.fillStyle = hexA(C3, .95 * k);
      ctx.shadowColor = C3; ctx.shadowBlur = 18;
      ctx.fill(); ctx.shadowBlur = 0;
    });

    ctx.restore();
  }

  function growthOverlay(k) {
    if (k <= 0.01) return;
    const xv = 1.3;
    const yLow = f2(xv), yHigh = f3(xv);
    const px = X(xv);

    ctx.save();
    ctx.strokeStyle = `rgba(250,204,21,${0.95 * k})`;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(px, Y(yLow)); ctx.lineTo(px, Y(yHigh));
    ctx.stroke();

    ctx.fillStyle = `rgba(250,204,21,${0.95 * k})`;
    ctx.beginPath();
    ctx.moveTo(px, Y(yHigh) - 2);
    ctx.lineTo(px - 6, Y(yHigh) + 10);
    ctx.lineTo(px + 6, Y(yHigh) + 10);
    ctx.closePath(); ctx.fill();

    ctx.beginPath();
    ctx.moveTo(px, Y(yLow) + 2);
    ctx.lineTo(px - 6, Y(yLow) - 10);
    ctx.lineTo(px + 6, Y(yLow) - 10);
    ctx.closePath(); ctx.fill();

    [[xv, yLow], [xv, yHigh]].forEach(pt => {
      ctx.beginPath();
      ctx.arc(X(pt[0]), Y(pt[1]), 5.5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.shadowColor = AM; ctx.shadowBlur = 20;
      ctx.fill(); ctx.shadowBlur = 0;
    });
    ctx.restore();
  }

  /* ================= STEPS DATA ================= */
  const M_BETWEEN_0_1 = '<span class="math-inline" dir="ltr">۰ &lt; x &lt; ۱</span>';
  const M_GREATER_1   = '<span class="math-inline" dir="ltr">x &gt; ۱</span>';
  const M_LESS_0      = '<span class="math-inline" dir="ltr">x &lt; ۰</span>';

  const P_ORIGIN  = '<span class="math-inline point" dir="ltr">(۰ , ۰)</span>';
  const P_ONE_ONE = '<span class="math-inline point" dir="ltr">(۱ , ۱)</span>';

  const steps = [
    {
      color: '#facc15',
      hl: 'p0',
      title: `مورد ۱ — نقطهٔ مشترک اول: مبدأ مختصات ${P_ORIGIN}`,
      text: 'هر دو تابع از مبدأ می‌گذرند؛ چون <b>۰² = ۰</b> و <b>۰³ = ۰</b>. نقطهٔ (۰ , ۰) با نور نارنجی درخشان، در مرکز توجه است.'
    },
    {
      color: '#facc15',
      hl: 'p1',
      title: `مورد ۲ — نقطهٔ مشترک دوم: ${P_ONE_ONE}`,
      text: 'در <b>x = ۱</b> هر دو تابع مقدار ۱ می‌گیرند: <b>۱² = ۱³ = ۱</b>. نقطهٔ (۱ , ۱) حالا با نور نارنجی پررنگ می‌درخشد.'
    },
    {
      color: '#10b981',
      hl: 'range',
      range: [0, 1],
      title: `مورد ۳ — بازهٔ ${M_BETWEEN_0_1} : نمودار x³ پایین‌تر از نمودار x² است`,
      text: 'برای <b>x = ۰٫۵</b> : <b>x² = ۰٫۲۵</b> و <b>x³ = ۰٫۱۲۵</b> ← <b>x³ &lt; x²</b>. بخش سبز (x²) بالای بخش نارنجی (x³) است.'
    },
    {
      color: '#f97316',
      hl: 'range',
      range: [1, 1.35],
      title: `مورد ۴ — بازهٔ ${M_GREATER_1} : نمودار x³ بالاتر از نمودار x² است`,
      text: 'برای <b>x = ۱٫۲</b> : <b>x² = ۱٫۴۴</b> و <b>x³ = ۱٫۷۲۸</b> ← <b>x³ &gt; x²</b>. بخش نارنجی (x³) بالای بخش سبز (x²) قرار می‌گیرد.'
    },
    {
      color: '#f97316',
      hl: 'range',
      range: [-1.1, 0],
      title: `مورد ۵ — بازهٔ ${M_LESS_0} : رفتار کاملاً متفاوت`,
      text: 'x² همیشه نامنفی است (سبز بالای محور)، اما x³ برای اعداد منفی منفی می‌شود (نارنجی زیر محور).'
    },
    {
      color: '#34d399',
      hl: 'symmetry',
      title: 'مورد ۶ — تقارن: زوج و فرد',
      text: 'x² تابع <b>زوج</b> است؛ نمودارش نسبت به محور yها متقارن است. اما x³ تابع <b>فرد</b> است؛ نمودارش نسبت به مبدأ مختصات متقارن است.'
    },
    {
      color: '#22d3ee',
      hl: 'growth',
      title: `مورد ۷ — سرعت رشد برای ${M_GREATER_1}`,
      text: 'هرچه x بزرگ‌تر شود، x³ با سرعت بیشتری رشد می‌کند؛ به همین دلیل فاصلهٔ دو نمودار برای <b>x &gt; ۱</b> مدام زیاد می‌شود (فلش عمودی).'
    }
  ];

  /* ================= DOM ================= */
  const stepsEl = document.getElementById('steps');
  const btn = document.getElementById('nextBtn');

  const cardEl = document.createElement('div');
  cardEl.className = 'step-card';
  stepsEl.appendChild(cardEl);

  function setCardContent(i) {
    const s = steps[i];
    cardEl.style.setProperty('--accent', s.color);
    cardEl.innerHTML = `
      <div class="num">${fa(i + 1)}</div>
      <div class="txt">
        <h3>${s.title}</h3>
        <p>${s.text}</p>
      </div>`;
  }
  setCardContent(0);

  /* ================= STATE ================= */
  let lastTs = null;
  let curveProg = 0;
  let introProgress = 0;
  let introDone = false;

  let stepIndex = -1;
  let stepAlpha = 0;
  let stepTarget = 0;
  let stepHead = 0;
  let pendingStep = null;

  /* ================= BUTTON ================= */
  function updateButton() {
    if (!introDone) {
      btn.disabled = true;
      btn.textContent = 'در حال آماده‌سازی…';
      return;
    }
    if (pendingStep !== null || (stepAlpha > 0.01 && stepAlpha < 0.99)) {
      btn.disabled = true;
      btn.textContent = 'در حال انتقال…';
      return;
    }
    btn.disabled = false;
    if (stepIndex === -1) {
      btn.textContent = 'شروع مقایسه ▶';
    } else if (stepIndex === steps.length - 1) {
      btn.textContent = 'شروع دوباره ↻';
    } else {
      btn.textContent = 'مورد بعدی ▶';
    }
  }

  btn.addEventListener('click', () => {
    if (!introDone) return;
    if (pendingStep !== null) return;
    if (stepAlpha > 0.01 && stepAlpha < 0.99) return;

    if (stepIndex === -1) {
      stepIndex = 0;
      stepHead = 0;
      setCardContent(0);
      stepTarget = 1;
    } else if (stepAlpha > 0.99) {
      pendingStep = (stepIndex + 1 < steps.length) ? (stepIndex + 1) : 'reset';
      stepTarget = 0;
    }
    updateButton();
  });

  /* ================= RENDER ================= */
  function render(t) {
    drawBg();
    drawGrid();
    drawAxes();

    const step = (stepIndex >= 0) ? steps[stepIndex] : null;
    const a = stepAlpha;

    if (step && a > 0.01 && step.hl === 'range') {
      const [xa, xb] = step.range;
      const top = (f2(xa) > f3(xa)) ? f2 : f3;
      const bot = (f2(xa) > f3(xa)) ? f3 : f2;
      shadeBetween(top, bot, xa, xb, `rgba(148,163,184,${0.12 * a})`);
    }

    drawCurve(f2, C2, curveProg);
    drawCurve(f3, C3, curveProg);

    if (step && step.hl === 'range' && a > 0.01 && curveProg > 0.95) {
      const [xa, xb] = step.range;
      const headFade = stepHead > 0.9 ? Math.max(0, (1 - stepHead) * 10) : 1;

      drawHighlightedSegment(f2, HL2, xa, xb, stepHead, headFade, a);
      drawHighlightedSegment(f3, HL3, xa, xb, stepHead, headFade, a);
    }

    if (step && a > 0.01 && curveProg > 0.95) {
      if (step.hl === 'symmetry') symmetryOverlay(a);
      if (step.hl === 'growth')   growthOverlay(a);
    }

    if (introProgress > 0) {
      const pulse = 0.55 + 0.18 * Math.sin(t * 3);
      let k0 = pulse, k1 = pulse;

      if (step && step.hl === 'p0') {
        const strong = 0.85 + 0.15 * Math.sin(t * 6);
        const strongMix = 0.55 + (strong - 0.55) * a;
        const faintMix  = 0.55 * (1 - a) + 0.10 * a;
        k0 = strongMix;
        k1 = faintMix;
      } else if (step && step.hl === 'p1') {
        const strong = 0.85 + 0.15 * Math.sin(t * 6);
        const strongMix = 0.55 + (strong - 0.55) * a;
        const faintMix  = 0.55 * (1 - a) + 0.10 * a;
        k1 = strongMix;
        k0 = faintMix;
      } else if (step && step.hl === 'range') {
        k0 = 0.35;
        k1 = 0.35;
      }

      glowPoint(0, 0, AM, k0 * introProgress);
      glowPoint(1, 1, AM, k1 * introProgress);
    }

    if (curveProg > 0.75) {
      chip('y = x²', X(-1.42), Y(2.10) - 6, C2);
      chip('y = x³', X(-0.92), Y(-0.78) - 34, C3);
    }
  }

  /* ================= LOOP ================= */
  function frame(ts) {
    if (lastTs === null) { lastTs = ts; requestAnimationFrame(frame); return; }
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    const tGlobal = ts / 1000;

    if (curveProg < 1) {
      curveProg = Math.min(1, curveProg + dt / 3.0);
    } else if (!introDone) {
      introProgress = Math.min(1, introProgress + dt / 1.2);
      if (introProgress >= 1) {
        introDone = true;
        updateButton();
      }
    }

    if (stepAlpha < stepTarget) {
      stepAlpha = Math.min(stepTarget, stepAlpha + dt * 3.5);
    } else if (stepAlpha > stepTarget) {
      stepAlpha = Math.max(stepTarget, stepAlpha - dt * 3.5);
    }

    if (stepAlpha === 0 && stepTarget === 0 && pendingStep !== null) {
      if (pendingStep === 'reset') {
        stepIndex = -1;
        pendingStep = null;
      } else {
        stepIndex = pendingStep;
        pendingStep = null;
        stepHead = 0;
        setCardContent(stepIndex);
        stepTarget = 1;
      }
      updateButton();
    }

    if (stepIndex >= 0 && stepAlpha > 0.05) {
      const stepData = steps[stepIndex];
      if (stepData.hl === 'range') {
        stepHead = Math.min(1, stepHead + dt * 0.75);
      } else {
        stepHead = 0;
      }
    }

    cardEl.style.opacity = stepAlpha.toFixed(3);

    render(tGlobal);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
